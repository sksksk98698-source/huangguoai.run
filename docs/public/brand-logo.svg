  <rect x="44" y="24" width="12" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="62" y="24" width="12" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.9" />
  <rect x="80" y="24" width="12" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Play icon / Dynamic Drama symbol in center -->
